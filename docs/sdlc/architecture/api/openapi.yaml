      description: Request a reset link; always returns neutral confirmation, enqueues
        email.
      operationId: post_auth_password_reset_request
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email}'
      responses:
        '200':
          description: '{message}'
  /auth/privacy-notice/ack:
    post:
      summary: Record acknowledgement of the privacy notice at first sign-in.
      description: Record acknowledgement of the privacy notice at first sign-in.
      operationId: post_auth_privacy_notice_ack
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '-'
      responses:
        '200':
          description: '{acked_at}'
      security:
      - bearerAuth: []
  /clock/break/start:
    post:
      summary: Start an unpaid break within the open shift.
