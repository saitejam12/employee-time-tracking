      description: Own daily and weekly totals with regular, overtime and break breakdown
        in local timezone.
      operationId: get_me_hours
      parameters: []
      responses:
        '200':
          description: '{days[], weeks[]}'
      security:
      - bearerAuth: []
  /privacy/{employee_id}:
    delete:
