  /employees/{id}:
    patch:
      summary: Edit employee identity, role, team, timezone and schedule.
      description: Edit employee identity, role, team, timezone and schedule.
      operationId: patch_employees_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
