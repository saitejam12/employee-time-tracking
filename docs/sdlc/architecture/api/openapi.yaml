  /export/timesheet.csv:
    get:
      summary: CSV timesheet for a pay period with per-employee regular, overtime,
        break and daily/weekly totals; overnight shifts on s
      description: CSV timesheet for a pay period with per-employee regular, overtime,
        break and daily/weekly totals; overnight shifts on start day.
      operationId: get_export_timesheet_csv
      parameters: []
      responses:
        '200':
          description: text/csv
      security:
      - bearerAuth: []
  /me/dashboard:
    get:
      summary: Current shift status (clocked in/on break/out) and elapsed time.
      description: Current shift status (clocked in/on break/out) and elapsed time.
      operationId: get_me_dashboard
      parameters: []
      responses:
        '200':
          description: '{status, since, elapsed_minutes}'
      security:
      - bearerAuth: []
  /me/hours:
    get:
      summary: Own daily and weekly totals with regular, overtime and break breakdown
