      - bearerAuth: []
  /corrections:
    get:
      summary: Own correction requests and their status.
      description: Own correction requests and their status.
      operationId: get_corrections
      parameters: []
      responses:
        '200':
          description: '{requests[]}'
      security:
      - bearerAuth: []
    post:
      summary: Employee submits a correction request; saved pending, manager emailed.
      description: Employee submits a correction request; saved pending, manager emailed.
      operationId: post_corrections
