components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    teams:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        manager_id:
          type: string
          format: uuid
      required:
      - id
      - name
    employees:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        password_hash:
          type: string
        role:
          type: string
        team_id:
          type: string
          format: uuid
        timezone:
          type: string
        expected_start_time:
          type: string
        standard_daily_hours:
          type: number
        is_active:
          type: boolean
        privacy_notice_acked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - role
      - timezone
      - is_active
      - created_at
    shifts:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        clock_in_at:
          type: string
          format: date-time
        clock_out_at:
          type: string
          format: date-time
        work_date:
          type: string
          format: date
        worked_minutes:
          type: integer
        status:
          type: string
      required:
      - id
      - employee_id
      - clock_in_at
      - work_date
      - status
    breaks:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        break_start_at:
          type: string
          format: date-time
        break_end_at:
          type: string
          format: date-time
      required:
      - id
      - shift_id
      - break_start_at
    daily_rollups:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        work_date:
          type: string
          format: date
        regular_minutes:
          type: integer
        overtime_minutes:
          type: integer
        break_minutes:
          type: integer
        is_missing_late:
          type: boolean
        is_under_hours:
          type: boolean
      required:
      - id
      - employee_id
      - work_date
      - regular_minutes
      - overtime_minutes
      - break_minutes
      - is_missing_late
      - is_under_hours
    correction_requests:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        proposed_clock_in_at:
          type: string
          format: date-time
        proposed_clock_out_at:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
        reviewed_by:
          type: string
          format: uuid
        decision_reason:
          type: string
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - employee_id
      - reason
      - status
      - created_at
    org_settings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        daily_threshold_hours:
          type: number
        weekly_threshold_hours:
          type: number
        missing_clockout_reminder_enabled:
          type: boolean
        reminder_window_hours:
          type: number
      required:
      - id
      - daily_threshold_hours
      - weekly_threshold_hours
      - missing_clockout_reminder_enabled
    password_reset_tokens:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        token_hash:
          type: string
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
      required:
      - id
      - employee_id
      - token_hash
      - expires_at
    audit_log:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        before_value:
          type: string
        after_value:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - action
      - entity_type
      - created_at
