      operationId: get_auth_me
      parameters: []
      responses:
        '200':
          description: '{id, name, role, timezone, privacy_notice_acked}'
      security:
      - bearerAuth: []
  /auth/password-reset/confirm:
    post:
      summary: Set a new password using a single-use time-limited token.
      description: Set a new password using a single-use time-limited token.
      operationId: post_auth_password_reset_confirm
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{token, new_password}'
      responses:
        '200':
          description: '{message}'
  /auth/password-reset/request:
    post:
      summary: Request a reset link; always returns neutral confirmation, enqueues
