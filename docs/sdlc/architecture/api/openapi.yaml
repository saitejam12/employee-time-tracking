          description: '{break_id, break_end_at}'
      security:
      - bearerAuth: []
  /clock/in:
    post:
      summary: Clock in and open a shift; blocked if a shift is open.
      description: Clock in and open a shift; blocked if a shift is open.
      operationId: post_clock_in
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '-'
      responses:
        '200':
          description: '{shift_id, clock_in_at, status}'
      security:
      - bearerAuth: []
  /clock/out:
    post:
      summary: Clock out, auto-end any running break, compute worked duration.
      description: Clock out, auto-end any running break, compute worked duration.
      operationId: post_clock_out
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '-'
      responses:
        '200':
          description: '{shift_id, clock_out_at, worked_minutes}'
